name: Refresh public contribution charts

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/update-public-activity.py'
      - '.github/workflows/public-activity.yml'
      - 'data/public-projects.json'

concurrency:
  group: public-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check collection and chart logic
        run: python3 .github/scripts/update-public-activity.py --self-test
      - name: Collect public data and render charts
        run: python3 .github/scripts/update-public-activity.py
      - name: Publish refreshed snapshot
        run: |
          git add data/public-activity.json PUBLIC_ACTIVITY.md assets/profile/activity-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): refresh public contribution charts'
          git push
